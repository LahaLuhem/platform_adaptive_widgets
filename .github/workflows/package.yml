name: Package checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  # PR runs cancel per PR, master runs cancel against later master commits. The
  # `|| github.ref` fallback covers push events, where there's no PR number.
  group: pkg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - run: flutter --no-version-check analyze lib

  deps:
    name: Dependency validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - run: dart pub global activate dependency_validator
      - run: dart pub global run dependency_validator

  test:
    name: Tests (AOT pruning guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - run: flutter --no-version-check test

  size-regression:
    name: AOT pruning size regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # flutter create fills in the android/ scaffolding and leaves existing files
      # alone. tool/size_harness/.gitignore lists what gets regenerated.
      - name: Generate Android scaffolding for size harness
        working-directory: tool/size_harness
        run: |
          flutter --no-version-check create \
            --platforms=android \
            --org=com.example.sizeharness \
            --project-name=size_harness \
            .
      - name: Resolve harness deps
        working-directory: tool/size_harness
        run: flutter --no-version-check pub get
      - name: Build release APK with size analysis
        working-directory: tool/size_harness
        run: |
          flutter --no-version-check build apk \
            --release \
            --analyze-size \
            --target-platform=android-arm64
      - name: Check size regression
        run: |
          json_file=$(find "$HOME/.flutter-devtools" -maxdepth 1 -name 'apk-code-size-analysis_*.json' -printf '%T@\t%p\n' | sort -rn | cut -f2- | head -1)
          echo "Using $json_file"
          dart tool/check_size_regression.dart "$json_file"

  # Job id is the check name master requires, so don't rename it or add a `name:`.
  # Skipped jobs count as passes, so the results get checked by hand.
  package-ok:
    needs: [analyze, deps, test, size-regression]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: >-
            analyze=${{ needs.analyze.result }}
            deps=${{ needs.deps.result }}
            test=${{ needs.test.result }}
            size-regression=${{ needs.size-regression.result }}
        run: |
          echo "$RESULTS"
          exit 1
