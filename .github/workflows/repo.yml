name: Repo-wide checks

on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-${{ github.event.pull_request.number }}-repo
  cancel-in-progress: true

permissions:
  contents: read

env:
  # One place to change the linter image. It's public on GHCR so runners pull it
  # without a login. Only :latest exists upstream, swap in an @sha256 here to pin.
  LINTERPOL_IMAGE: ghcr.io/lahaluhem/linterpol:latest

jobs:
  format:
    name: Dart format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # Format reads files as-is, so skip setup-flutter and save 10-30s a run.
      - run: dart format --output=none --set-exit-if-changed .

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The glob expands on the runner, at the repo root, then resolves under /work.
      - run: docker run --rm -v "$PWD:/work:ro" "$LINTERPOL_IMAGE" shellcheck scripts/*.sh

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No args needed. It finds the workflows itself and shellchecks each run: block.
      - run: docker run --rm -v "$PWD:/work:ro" "$LINTERPOL_IMAGE" actionlint

  # Job id is the check name master requires, so don't rename it or add a `name:`.
  # Skipped jobs count as passes, so the results get checked by hand.
  repo-ok:
    needs: [format, shellcheck, actionlint]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: >-
            format=${{ needs.format.result }}
            shellcheck=${{ needs.shellcheck.result }}
            actionlint=${{ needs.actionlint.result }}
        run: |
          echo "$RESULTS"
          exit 1
