name: Size regression

# No `paths:` filter: a run it skips never reports, which leaves the required check waiting.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  size-regression:
    name: AOT pruning size regression (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # Each platform reports its own count, so one failing doesn't cancel the other.
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
            build: apk --target-platform=android-arm64
          - platform: ios
            runner: macos-latest
            build: ios --no-codesign
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: matrix.platform == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          java-package: jdk
          set-default: true
          cache: gradle
      # `flutter create` below gets the harness's packages, and the check uses none.
      - uses: LahaLuhem/dartender/actions/setup-flutter@main
        with:
          pub-get: false
      # The harness keeps no platform folders in git, so this makes the one it builds.
      - working-directory: tool/size_harness
        run: flutter create --platforms=${{ matrix.platform }} .
      - working-directory: tool/size_harness
        run: flutter build ${{ matrix.build }} --release --analyze-size
      - run: dart tool/check_size_regression.dart

  # The ruleset requires this job's id, so it gets no `name:`.
  size-regression-ok:
    needs: size-regression
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULTS: size-regression=${{ needs.size-regression.result }}
        run: echo "$RESULTS"
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
