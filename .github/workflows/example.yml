name: Example checks

on:
  pull_request:
    branches: [master]

concurrency:
  group: pr-${{ github.event.pull_request.number }}-example
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: example

jobs:
  analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          working-directory: example
      - run: flutter --no-version-check analyze .

  deps:
    name: Dependency validator (example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          working-directory: example
      - run: dart pub global activate dependency_validator
      - run: dart pub global run dependency_validator


  # Job id is the check name master's ruleset requires. Renaming it, or adding a
  # `name:`, silently breaks the gate. always() keeps it reporting when upstream
  # fails, and results get read by hand because a skipped job counts as a pass.
  example-ok:
    needs: [analyze, deps]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    # Nothing gets checked out here, so back out of the file-level example/ default.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: >-
            analyze=${{ needs.analyze.result }}
            deps=${{ needs.deps.result }}
        run: |
          echo "$RESULTS"
          exit 1
