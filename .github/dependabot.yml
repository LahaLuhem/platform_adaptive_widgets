# Dependabot version updates.
# Reference: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# pr-conventions.yml and changelog.yml skip dependabot[bot], so these PRs land
# with no CHANGELOG entry. Add one by hand if a root-package bump is
# user-visible. The commit-length and no-merge-commit checks still apply.
#
# Bumps are grouped into one PR per ecosystem to cut noise. Majors arrive on
# their own so they can be reviewed in isolation, Actions aside.
version: 2

updates:
  # --- Dart / Flutter: published library ---
  # Bumps the version constraints in the root pubspec.yaml. pub.dev packages
  # only. Git and path deps are not eligible.
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pub:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Dart / Flutter: example app ---
  - package-ecosystem: "pub"
    directory: "/example"
    schedule:
      interval: "weekly"
    groups:
      pub-example:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Android / Gradle: example app ---
  # Covers the plugins/deps in the *.gradle.kts files AND the Gradle wrapper
  # version in gradle/wrapper/gradle-wrapper.properties
  # (dependabot-core#7124, shipped Feb 2026).
  - package-ecosystem: "gradle"
    directory: "/example/android"
    schedule:
      interval: "weekly"
    groups:
      gradle:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- GitHub Actions ---
  # `directory: "/"` scans everything under .github/, both the workflows and the
  # local composite action at .github/actions/setup-flutter.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
        # Majors included, since dependabot-automerge.yml merges these anyway.
        update-types: ["major", "minor", "patch"]
