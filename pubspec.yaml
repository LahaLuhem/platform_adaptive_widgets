name: platform_adaptive_widgets
description: "A spiritual continuation of flutter_platform_widgets library"
version: 3.1.0
homepage: https://github.com/LahaLuhem/platform_adaptive_widgets?tab=readme-ov-file
repository: https://github.com/LahaLuhem/platform_adaptive_widgets

topics:
  - adaptive
  - widget
  - material-design
  - material3
  - cupertino
screenshots:
  - description: >-
      The live property editor on the same button, Material and Cupertino side by side.
    path: doc/screenshots/property_editor.webp
  - description: >-
      The actions menu on Material: an M3 menu, Delete in the error colour.
    path: doc/screenshots/material.png
  - description: >-
      The same menu on Cupertino: a pull-down, Delete in red.
    path: doc/screenshots/cupertino.png





environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"





dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.10.0
  cupertino_ui: ^1.1.6
  minted_chronology: ^1.1.0
  smooth_sheets: ^1.3.0





dev_dependencies:
  analyzer: ^14.7.0   # test/guards
  bdd_framework: ^4.0.7
  checks: ^0.3.2
  collection: ^1.19.1
  dartender_lints:
    git:
      url: https://github.com/LahaLuhem/dartender.git
      path: lints
      ref: main
  flutter_test:
    sdk: flutter
  # Analysis
  # dcm check-unused-files lib --exclude-public-api
  # Selectively on/off due to https://github.com/huanghui1998hhh/prefer_shorthands/issues/7
#  prefer_shorthands: ^0.4.7

cider:
  link_template:
    tag: https://github.com/LahaLuhem/platform_adaptive_widgets/releases/tag/%tag%
    diff: https://github.com/LahaLuhem/platform_adaptive_widgets/compare/%from%...%to%
