name: example
description: "A new Flutter project."
publish_to: 'none'

version: 0.0.1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  platform_adaptive_widgets:
    path: ../

  cupertino_ui: ^1.1.6
  gap: ^3.1.0
  go_router: ^18.1.3
  material_ui: ^1.11.0
  minted_chronology: ^1.1.0
  multi_value_listenable_builder_typed: ^0.2.1
  platform_icons: ^0.1.1
  pmvvm: ^4.0.1

flutter:
  uses-material-design: true
dev_dependencies:
  dartender_lints:
    git:
      url: https://github.com/LahaLuhem/dartender.git
      path: lints
      # Before Dart 3.14's lints, which 3.13 rejects. Back to main with the SDK bump.
      ref: cc451a5
