# Checked-in to override the `flutter create`-generated default, which
# `include:`s `package:flutter_lints/flutter.yaml`: unresolvable from the
# root package's context and noisy under `dart format .` / `dart fix`.
#
# The harness is a one-file demo, so the analyzer's own checks are enough, with no lints.

analyzer:
  exclude:
    - build/**
    - android/**
formatter:
  page_width: 100
